name: tracr
description: "dodong project T_T"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shadcn_ui: ^0.55.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  gap: ^3.0.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.6
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  collection: ^1.19.1
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  image: ^4.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: Noto
      fonts:
        - asset: assets/fonts/Noto Sans/static/NotoSans-Regular.ttf
        - asset: assets/fonts/Noto Sans/static/NotoSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/Noto Sans/static/NotoSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Noto Sans/static/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/Noto Sans/static/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto Sans/static/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto Sans/static/NotoSans-ExtraBold.ttf
          weight: 800 
        - asset: assets/fonts/Noto Sans/static/NotoSans-Black.ttf
          weight: 900
        - asset: assets/fonts/Noto Sans/static/NotoSans-Italic.ttf
          style: italic